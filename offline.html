<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You are offline</title>
    <meta name="theme-color" content="#0b1120">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 20% 10%, #1e293b, #070b14 60%); color: #e2e8f0;
        }
        .card {
            max-width: 460px; text-align: center; padding: 40px 32px; border-radius: 22px;
            background: rgba(15, 23, 42, .82); border: 1px solid rgba(148, 163, 184, .18);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
        }
        .badge {
            width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 18px; display: grid; place-items: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6); font-size: 28px;
        }
        h1 { font-size: 1.4rem; margin: 0 0 10px; }
        p { margin: 0 0 24px; color: #93a5c1; line-height: 1.65; }
        button {
            appearance: none; border: 0; cursor: pointer; padding: 13px 26px; border-radius: 12px;
            font-weight: 600; font-size: .98rem; color: #fff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 24px rgba(99, 102, 241, .35);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">⚡</div>
        <h1>You are offline</h1>
        <p>The page needs an internet connection to load your video. Reconnect and try again — your access stays intact.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
